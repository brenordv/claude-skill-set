name: repo-lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Both implementations run on purpose: the two scripts are kept in sync by hand, so a divergence
# (an OS quirk, a regex dialect difference, a drifted edit) shows up as one job failing while the
# other passes.
jobs:
  lint-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repo lint (bash)
        run: bash tools/lint-repo.sh
      - name: Run hook tests (bash)
        run: bash tools/test-hooks.sh

  # Runs the hook tests under the macOS image's system bash 3.2.57, the interpreter the hooks ship to
  # and the one that mis-parses a command-substitution heredoc. The step calls /bin/bash directly
  # rather than `shell: bash` (which resolves through PATH to a newer bash), so this stays a true 3.2
  # reproducer. This is not a redundant re-run of lint-bash's hook step: only bash 3.2 can catch the
  # parse-failure class, and Ubuntu's bash 5.2 parses the buggy pattern without complaint.
  hook-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hook tests (macOS /bin/bash 3.2)
        run: /bin/bash tools/test-hooks.sh

  lint-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repo lint (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\lint-repo.ps1
      - name: Parse-check hook PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem hooks\*.ps1 | ForEach-Object {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Host "ParseError in $($_.Name):"
              $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      # Runs the .ps1 hooks against the same case table the bash jobs run the .sh hooks against
      # (tools/hook-cases.tsv), under Windows PowerShell 5.1, the interpreter the install snippets
      # register. The parse check above stays separate so a parse failure reports as one, not as
      # behavior noise.
      - name: Run hook behavior tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\test-hooks.ps1

  # One step per gate suite, each with if: always(), so one suite's failure never hides the other
  # two results while their size constants are cross-checked by hand and by the harness.
  gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run python quality gate unit tests
        if: always()
        run: python3 -m unittest discover -s skills/python/scripts
      - name: Run csharp quality gate unit tests
        if: always()
        run: python3 -m unittest discover -s skills/csharp/scripts
      - name: Run rust quality gate unit tests
        if: always()
        run: python3 -m unittest discover -s skills/rust/scripts
